name: Build SplitBill Apps (iOS, Android, Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build iOS IPA & Android APK
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build iOS Application (.app)
        run: flutter build ios --release --no-codesign

      - name: Package SplitBill.ipa for iPhone Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SplitBill.ipa Payload

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload SplitBill.ipa (for iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: SplitBill-iOS-IPA
          path: SplitBill.ipa

      - name: Upload SplitBill.apk (for Android)
        uses: actions/upload-artifact@v4
        with:
          name: SplitBill-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows 1-Click EXE Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Compile 1-Click Installer (SplitBill_Setup.exe)
        run: iscc installer.iss

      - name: Upload SplitBill-Windows-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: SplitBill-Windows-Setup-EXE
          path: dist/SplitBill_Setup.exe
