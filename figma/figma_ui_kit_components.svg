  <g id="SectionAudio" transform="translate(40, 560)">
    <text x="0" y="20" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729">4. Audio Waveform Player Component</text>

    <rect x="0" y="36" width="760" height="84" rx="20" fill="#0F1729"/>
    <circle cx="48" cy="78" r="22" fill="#EC4899"/>
    <polygon points="44,70 44,86 58,78" fill="#FFFFFF"/>

    <!-- Waveform Bars -->
    <g transform="translate(90, 62)">
      <rect x="0" y="10" width="5" height="12" rx="2.5" fill="#EC4899"/>
      <rect x="10" y="4" width="5" height="24" rx="2.5" fill="#EC4899"/>
      <rect x="20" y="0" width="5" height="32" rx="2.5" fill="#EC4899"/>
      <rect x="30" y="8" width="5" height="16" rx="2.5" fill="#EC4899"/>
      <rect x="40" y="2" width="5" height="28" rx="2.5" fill="#EC4899"/>
      <rect x="50" y="6" width="5" height="20" rx="2.5" fill="#EC4899"/>
      <rect x="60" y="0" width="5" height="32" rx="2.5" fill="#EC4899"/>
      <rect x="70" y="10" width="5" height="12" rx="2.5" fill="#64748B"/>
      <rect x="80" y="4" width="5" height="24" rx="2.5" fill="#64748B"/>
      <rect x="90" y="2" width="5" height="28" rx="2.5" fill="#64748B"/>
      <rect x="100" y="8" width="5" height="16" rx="2.5" fill="#64748B"/>
      <rect x="110" y="0" width="5" height="32" rx="2.5" fill="#64748B"/>
      <rect x="120" y="6" width="5" height="20" rx="2.5" fill="#64748B"/>
      <rect x="130" y="4" width="5" height="24" rx="2.5" fill="#64748B"/>
      <rect x="140" y="10" width="5" height="12" rx="2.5" fill="#64748B"/>
      <rect x="150" y="2" width="5" height="28" rx="2.5" fill="#64748B"/>
      <rect x="160" y="0" width="5" height="32" rx="2.5" fill="#64748B"/>
      <rect x="170" y="8" width="5" height="16" rx="2.5" fill="#64748B"/>
      <rect x="180" y="4" width="5" height="24" rx="2.5" fill="#64748B"/>
      <rect x="190" y="10" width="5" height="12" rx="2.5" fill="#64748B"/>
      <rect x="200" y="0" width="5" height="32" rx="2.5" fill="#64748B"/>
      <rect x="210" y="6" width="5" height="20" rx="2.5" fill="#64748B"/>
      <rect x="220" y="4" width="5" height="24" rx="2.5" fill="#64748B"/>
      <rect x="230" y="8" width="5" height="16" rx="2.5" fill="#64748B"/>
      <rect x="240" y="2" width="5" height="28" rx="2.5" fill="#64748B"/>
      <rect x="250" y="0" width="5" height="32" rx="2.5" fill="#64748B"/>
    </g>

    <text x="420" y="82" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#F8FAFC">0:04 / 0:12</text>
    <rect x="560" y="60" width="180" height="36" rx="10" fill="#1E293B"/>
    <text x="650" y="82" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">Voice Persona: น้องนุ่ม 😊</text>
  </g>

  <!-- SECTION 5: Form Inputs & Segmentation -->
  <g id="SectionInputs" transform="translate(40, 710)">
    <text x="0" y="20" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729">5. Form Inputs & Segmented Controls</text>

    <!-- Text Input -->
    <rect x="0" y="36" width="360" height="46" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="16" y="64" font-family="'Prompt', sans-serif" font-size="14" fill="#0F1729">ราเมงฮาจิบัง สยามพารากอน</text>

    <!-- Segmented Control -->
    <rect x="400" y="36" width="360" height="46" rx="14" fill="#FFFFFF" stroke="#EDF0F5"/>
    <rect x="404" y="40" width="176" height="38" rx="11" fill="#2D6BFF"/>
    <text x="492" y="64" font-family="'Prompt', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">หารเท่ากัน</text>
    <text x="670" y="64" font-family="'Prompt', sans-serif" font-size="13" font-weight="500" fill="#4B5563" text-anchor="middle">หารตามจริง</text>
  </g>

  <!-- SECTION 6: Color Tokens Palette Swatches -->
  <g id="SectionColors" transform="translate(40, 830)">
    <text x="0" y="20" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729">6. Color Palette Swatches</text>

    <rect x="0" y="36" width="90" height="50" rx="10" fill="#2D6BFF"/>
    <text x="45" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">#2D6BFF</text>

    <rect x="100" y="36" width="90" height="50" rx="10" fill="#EC4899"/>
    <text x="145" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">#EC4899</text>

    <rect x="200" y="36" width="90" height="50" rx="10" fill="#0FBF7F"/>
    <text x="245" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">#0FBF7F</text>

    <rect x="300" y="36" width="90" height="50" rx="10" fill="#FF8A3D"/>
    <text x="345" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">#FF8A3D</text>

    <rect x="400" y="36" width="90" height="50" rx="10" fill="#E5484D"/>
    <text x="445" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">#E5484D</text>

    <rect x="500" y="36" width="90" height="50" rx="10" fill="#0F1729"/>
    <text x="545" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">#0F1729</text>

    <rect x="600" y="36" width="90" height="50" rx="10" fill="#F5F7FA" stroke="#CBD5E1"/>
    <text x="645" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0F1729" text-anchor="middle">#F5F7FA</text>
