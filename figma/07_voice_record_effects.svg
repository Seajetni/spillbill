    <!-- FX 1: ปกติ -->
    <rect x="20" y="482" width="108" height="74" rx="16" fill="#FFFFFF" stroke="#EDF0F5"/>
    <text x="74" y="512" font-size="20" text-anchor="middle">🎙️</text>
    <text x="74" y="538" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#0F1729" text-anchor="middle">เสียงปกติ</text>

    <!-- FX 2: ชิพมังก์ (Selected) -->
    <rect x="142" y="482" width="108" height="74" rx="16" fill="#EAF0FF" stroke="#2D6BFF" stroke-width="2"/>
