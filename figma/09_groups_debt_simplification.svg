<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-s9" x="-4" y="0" width="401" height="860" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F1729" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="group-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6BFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="393" height="852" rx="44" fill="#F5F7FA"/>

  <!-- Status Bar -->
  <rect x="131" y="11" width="131" height="35" rx="17.5" fill="#000000"/>
  <text x="36" y="34" font-family="'Prompt', sans-serif" font-size="15" font-weight="600" fill="#0F1729">9:41</text>
  <path d="M340 24h18v10h-18z" rx="3" stroke="#0F1729" stroke-width="2" fill="none"/>
  <rect x="342" y="26" width="12" height="6" rx="1.5" fill="#0F1729"/>
  <path d="M359 27v4" stroke="#0F1729" stroke-width="2" stroke-linecap="round"/>

  <!-- App Bar -->
  <g id="AppBar">
    <rect x="20" y="60" width="40" height="40" rx="12" fill="#FFFFFF" stroke="#EDF0F5"/>
    <path d="M43 75l-5 5 5 5" stroke="#0F1729" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="196" y="86" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#0F1729" text-anchor="middle">ทริปเขาใหญ่ ⛰️</text>
    
    <rect x="333" y="60" width="40" height="40" rx="12" fill="#EAF0FF"/>
    <text x="353" y="84" font-family="'Prompt', sans-serif" font-size="18" font-weight="600" fill="#2D6BFF" text-anchor="middle">+</text>
  </g>

  <!-- Group Summary Hero Card -->
  <g id="GroupSummary" filter="url(#shadow-s9)">
    <rect x="20" y="114" width="353" height="98" rx="20" fill="#FFFFFF" stroke="#EDF0F5"/>
    
    <text x="38" y="140" font-family="'Prompt', sans-serif" font-size="12" fill="#9AA3B2">ยอดใช้จ่ายรวมทั้งกลุ่ม (5 คน)</text>
    <text x="38" y="172" font-family="'Kanit', sans-serif" font-size="28" font-weight="800" fill="#0F1729">฿12,450.00</text>
    
    <!-- Avatars Stack -->
    <g transform="translate(240, 138)">
      <circle cx="20" cy="18" r="14" fill="#EAF0FF" stroke="#FFFFFF" stroke-width="2"/>
      <text x="20" y="23" font-size="13" text-anchor="middle">👨‍💻</text>
      <circle cx="40" cy="18" r="14" fill="#FFF1E7" stroke="#FFFFFF" stroke-width="2"/>
      <text x="40" y="23" font-size="13" text-anchor="middle">👩‍🎨</text>
      <circle cx="60" cy="18" r="14" fill="#E4F8F1" stroke="#FFFFFF" stroke-width="2"/>
      <text x="60" y="23" font-size="13" text-anchor="middle">🧑‍💼</text>
      <circle cx="80" cy="18" r="14" fill="#FDF2F8" stroke="#FFFFFF" stroke-width="2"/>
      <text x="80" y="23" font-size="13" text-anchor="middle">👩‍🔬</text>
    </g>
    
    <text x="38" y="196" font-family="'Prompt', sans-serif" font-size="11" fill="#0FBF7F">● ป๊อปสำรองจ่ายมากที่สุด (฿6,800.00)</text>
  </g>

  <!-- Debt Simplification Graph Feature (Smart Algorithm) -->
  <text x="24" y="236" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729">อัลกอริทึมลดยอดหนี้ซ้ำซ้อน (Debt Graph)</text>
  
  <g id="DebtGraphCard" filter="url(#shadow-s9)">
    <rect x="20" y="248" width="353" height="196" rx="20" fill="#FFFFFF" stroke="#EDF0F5"/>
    
    <rect x="36" y="260" width="180" height="24" rx="8" fill="#F0FDF4" stroke="#DCFCE7"/>
    <text x="126" y="276" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" fill="#16A34A" text-anchor="middle">⚡ ลดจาก 7 ครั้ง เหลือโอนแค่ 3 ครั้ง</text>

    <!-- Graph Nodes -->
    <!-- Node Pop (Top) -->
    <circle cx="196" cy="320" r="22" fill="#EAF0FF" stroke="#2D6BFF" stroke-width="2"/>
    <text x="196" y="327" font-size="20" text-anchor="middle">👨‍💻</text>
    <text x="196" y="354" font-family="'Prompt', sans-serif" font-size="11" font-weight="700" fill="#2D6BFF" text-anchor="middle">ป๊อป (รับ ฿2,050)</text>

    <!-- Node Mint (Bottom Left) -->
    <circle cx="90" cy="396" r="20" fill="#FFF1E7" stroke="#FF8A3D" stroke-width="2"/>
    <text x="90" y="403" font-size="18" text-anchor="middle">👩‍🎨</text>
    <text x="90" y="428" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle">มิ้นท์</text>

    <!-- Node Oak (Bottom Right) -->
    <circle cx="302" cy="396" r="20" fill="#FFF1E7" stroke="#FF8A3D" stroke-width="2"/>
    <text x="302" y="403" font-size="18" text-anchor="middle">🧑‍💼</text>
    <text x="302" y="428" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#4B5563" text-anchor="middle">โอ๊ค</text>

    <!-- Transfer Arrow: Mint -> Pop -->
    <line x1="108" y1="382" x2="176" y2="336" stroke="#0FBF7F" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="176,336 166,334 172,344" fill="#0FBF7F"/>
    <rect x="114" y="344" width="56" height="20" rx="6" fill="#E4F8F1"/>
    <text x="142" y="358" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#0FBF7F" text-anchor="middle">฿850</text>

    <!-- Transfer Arrow: Oak -> Pop -->
    <line x1="284" y1="382" x2="216" y2="336" stroke="#0FBF7F" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="216,336 220,344 226,334" fill="#0FBF7F"/>
    <rect x="222" y="344" width="58" height="20" rx="6" fill="#E4F8F1"/>
    <text x="251" y="358" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#0FBF7F" text-anchor="middle">฿1,200</text>
  </g>

  <!-- Group Bills History -->
  <text x="24" y="470" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729">ประวัติบิลในกลุ่มนี้ (3 บิล)</text>
  
  <g id="BillHistoryList">
    <!-- Bill 1 -->
    <rect x="20" y="484" width="353" height="70" rx="16" fill="#FFFFFF" stroke="#EDF0F5"/>
    <circle cx="52" cy="519" r="18" fill="#F8FAFC"/>
    <text x="52" y="526" font-size="18" text-anchor="middle">🏡</text>
    <text x="82" y="512" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#0F1729">ค่าที่พักพูลวิลล่า 2 คืน</text>
    <text x="82" y="530" font-family="'Prompt', sans-serif" font-size="11" fill="#9AA3B2">ป๊อปออกให้ • 5 คน</text>
    <text x="355" y="522" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729" text-anchor="end">฿8,400.00</text>

    <!-- Bill 2 -->
    <rect x="20" y="562" width="353" height="70" rx="16" fill="#FFFFFF" stroke="#EDF0F5"/>
    <circle cx="52" cy="597" r="18" fill="#F8FAFC"/>
    <text x="52" y="604" font-size="18" text-anchor="middle">🍲</text>
    <text x="82" y="590" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#0F1729">หมูกระทะเตาถ่านริมน้ำ</text>
    <text x="82" y="608" font-family="'Prompt', sans-serif" font-size="11" fill="#9AA3B2">โอ๊คออกให้ • 4 คน</text>
    <text x="355" y="600" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729" text-anchor="end">฿2,550.00</text>

    <!-- Bill 3 -->
    <rect x="20" y="640" width="353" height="70" rx="16" fill="#FFFFFF" stroke="#EDF0F5"/>
    <circle cx="52" cy="675" r="18" fill="#F8FAFC"/>
    <text x="52" y="682" font-size="18" text-anchor="middle">⛽</text>
    <text x="82" y="668" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#0F1729">ค่าน้ำมันรถตู้ไป-กลับ</text>
    <text x="82" y="686" font-family="'Prompt', sans-serif" font-size="11" fill="#9AA3B2">เฟิร์นออกให้ • 5 คน</text>
    <text x="355" y="678" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729" text-anchor="end">฿1,500.00</text>
  </g>

  <!-- Bottom CTA -->
  <g id="BottomAction">
    <rect x="0" y="734" width="393" height="118" fill="#FFFFFF" stroke="#EDF0F5"/>
    <rect x="20" y="750" width="353" height="52" rx="16" fill="url(#group-btn-grad)"/>
    <text x="196" y="782" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ เพิ่มบิลใหม่เข้าทริปเขาใหญ่</text>
    <rect x="129" y="838" width="135" height="5" rx="2.5" fill="#0F1729"/>
  </g>
</svg>
