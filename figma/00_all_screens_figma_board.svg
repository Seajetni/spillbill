<svg width="4960" height="2100" viewBox="0 0 4960 2100" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="master-shadow" x="-8" y="0" width="415" height="870" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F1729" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="4960" height="2100" fill="#141414"/>

  <!-- Master Header Banner -->
  <g id="MasterHeader" transform="translate(100, 60)">
    <rect width="4760" height="100" rx="24" fill="#1E293B" stroke="#334155"/>
    <text x="50" y="52" font-family="'Kanit', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">❖ SplitBill Application — Master Figma System Board (Complete Flow)</text>
    <text x="50" y="80" font-family="'Prompt', sans-serif" font-size="16" fill="#94A3B8">ระบบจำลองหน้าจอและ Prototype Flow ครบ 12 จอหลัก • รองรับการ Import เข้า Figma โดยตรง • Dimension: iPhone 16 Pro (393 × 852 px)</text>
    
    <rect x="4460" y="30" width="250" height="42" rx="12" fill="#0D99FF"/>
    <text x="4585" y="56" font-family="'Prompt', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Figma Native Vectors</text>
  </g>

  <!-- ROW 1: Core Bill Flow (Screens 01 - 06) -->
  <!-- Col 1: Screen 01 - Home Dashboard -->
  <g id="FigmaFrame_01" transform="translate(100, 220)" filter="url(#master-shadow)">
    <text x="0" y="-14" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#38BDF8">01. Home Dashboard (หน้าแรก &amp; ยอดสุทธิ)</text>
    <image href="01_home_dashboard.svg" width="393" height="852"/>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <g transform="translate(505, 600)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#0D99FF" stroke-width="3" stroke-dasharray="6 6"/>
    <polygon points="75,0 60,-6 60,6" fill="#0D99FF"/>
    <rect x="10" y="-24" width="55" height="18" rx="4" fill="#0D99FF"/>
    <text x="37" y="-11" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">สร้างบิล</text>
  </g>

  <!-- Col 2: Screen 02 - Manual Bill Entry -->
  <g id="FigmaFrame_02" transform="translate(590, 220)" filter="url(#master-shadow)">
    <text x="0" y="-14" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#38BDF8">02. Manual Bill Entry (กรอกบิล &amp; รายการ)</text>
    <image href="02_manual_bill_entry.svg" width="393" height="852"/>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <g transform="translate(995, 600)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#0D99FF" stroke-width="3" stroke-dasharray="6 6"/>
    <polygon points="75,0 60,-6 60,6" fill="#0D99FF"/>
    <rect x="10" y="-24" width="55" height="18" rx="4" fill="#0D99FF"/>
    <text x="37" y="-11" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">เลือกวิธี</text>
  </g>

  <!-- Col 3: Screen 03 - Split Mode Selection -->
  <g id="FigmaFrame_03" transform="translate(1080, 220)" filter="url(#master-shadow)">
    <text x="0" y="-14" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#38BDF8">03. Split Mode (วิธีหาร &amp; ปัดเศษสตางค์)</text>
    <image href="03_split_mode_selection.svg" width="393" height="852"/>
