<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-s11" x="-4" y="0" width="401" height="860" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F1729" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="primary-grad-s11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6BFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="393" height="852" rx="44" fill="#F5F7FA"/>

  <!-- Status Bar -->
  <rect x="131" y="11" width="131" height="35" rx="17.5" fill="#000000"/>
  <text x="36" y="34" font-family="'Prompt', sans-serif" font-size="15" font-weight="600" fill="#0F1729">9:41</text>
  <path d="M340 24h18v10h-18z" rx="3" stroke="#0F1729" stroke-width="2" fill="none"/>
  <rect x="342" y="26" width="12" height="6" rx="1.5" fill="#0F1729"/>
  <path d="M359 27v4" stroke="#0F1729" stroke-width="2" stroke-linecap="round"/>

  <!-- App Bar -->
  <g id="AppBar">
    <text x="24" y="86" font-family="'Kanit', sans-serif" font-size="22" font-weight="700" fill="#0F1729">โปรไฟล์และการตั้งค่า</text>
  </g>

  <!-- User Info Card -->
  <g id="ProfileCard" filter="url(#shadow-s11)">
    <rect x="20" y="112" width="353" height="98" rx="20" fill="#FFFFFF" stroke="#EDF0F5"/>
    
    <circle cx="60" cy="161" r="26" fill="#EAF0FF"/>
    <text x="60" y="170" font-size="26" text-anchor="middle">👨‍💻</text>
    
    <text x="100" y="150" font-family="'Prompt', sans-serif" font-size="16" font-weight="700" fill="#0F1729">ป๊อป (ฉันเอง)</text>
    <text x="100" y="170" font-family="'Prompt', sans-serif" font-size="12" fill="#9AA3B2">pop.tech@splitbill.app</text>
    
    <rect x="100" y="178" width="132" height="22" rx="6" fill="#E4F8F1"/>
    <text x="166" y="193" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0FBF7F" text-anchor="middle">PromptPay: 081-234-5678</text>
  </g>

  <!-- Bank Accounts Section -->
  <text x="24" y="238" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729">บัญชีรับเงินของฉัน (Bank Accounts)</text>

  <g id="BankAccounts" filter="url(#shadow-s11)">
    <rect x="20" y="250" width="353" height="152" rx="20" fill="#FFFFFF" stroke="#EDF0F5"/>
    
    <!-- Bank 1: KBank -->
    <circle cx="48" cy="282" r="14" fill="#138F2D"/>
    <text x="48" y="287" font-family="'Kanit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">K</text>
    <text x="72" y="278" font-family="'Prompt', sans-serif" font-size="13" font-weight="600" fill="#0F1729">ธนาคารกสิกรไทย</text>
    <text x="72" y="294" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9AA3B2">045-8-12345-6</text>
    <rect x="286" y="270" width="72" height="24" rx="6" fill="#E4F8F1"/>
    <text x="322" y="286" font-family="'Prompt', sans-serif" font-size="10" font-weight="700" fill="#0FBF7F" text-anchor="middle">บัญชีหลัก ✓</text>
    <line x1="36" y1="310" x2="357" y2="310" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Bank 2: SCB -->
    <circle cx="48" cy="336" r="14" fill="#4E2A84"/>
    <text x="48" y="341" font-family="'Kanit', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">SCB</text>
    <text x="72" y="332" font-family="'Prompt', sans-serif" font-size="13" font-weight="600" fill="#0F1729">ธนาคารไทยพาณิชย์</text>
    <text x="72" y="348" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9AA3B2">408-2-98765-4</text>
    <line x1="36" y1="364" x2="357" y2="364" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Add Bank Button -->
    <text x="196" y="388" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#2D6BFF" text-anchor="middle">+ เพิ่มบัญชีธนาคารใหม่</text>
  </g>

  <!-- Preferences Section -->
  <text x="24" y="430" font-family="'Kanit', sans-serif" font-size="16" font-weight="700" fill="#0F1729">การตั้งค่าระบบและเสียง AI</text>

  <g id="PreferencesCard" filter="url(#shadow-s11)">
    <rect x="20" y="442" width="353" height="194" rx="20" fill="#FFFFFF" stroke="#EDF0F5"/>
    
    <!-- Row 1: Push Notif -->
    <text x="38" y="472" font-family="'Prompt', sans-serif" font-size="13" font-weight="500" fill="#0F1729">แจ้งเตือนเมื่อมีคนโอนเงินเข้า</text>
    <!-- Toggle Switch ON -->
    <rect x="317" y="458" width="40" height="22" rx="11" fill="#0FBF7F"/>
    <circle cx="347" cy="469" r="8" fill="#FFFFFF"/>
    <line x1="38" y1="492" x2="355" y2="492" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 2: Default Persona -->
    <text x="38" y="518" font-family="'Prompt', sans-serif" font-size="13" font-weight="500" fill="#0F1729">บุคลิกเสียง AI เริ่มต้น</text>
    <text x="355" y="518" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#EC4899" text-anchor="end">น้องนุ่ม 😊</text>
    <line x1="38" y1="538" x2="355" y2="538" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 3: Language -->
    <text x="38" y="564" font-family="'Prompt', sans-serif" font-size="13" font-weight="500" fill="#0F1729">ภาษาการแสดงผล (Language)</text>
    <text x="355" y="564" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#2D6BFF" text-anchor="end">ภาษาไทย 🇹🇭</text>
    <line x1="38" y1="584" x2="355" y2="584" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 4: Currency -->
    <text x="38" y="610" font-family="'Prompt', sans-serif" font-size="13" font-weight="500" fill="#0F1729">สกุลเงินเริ่มต้น</text>
    <text x="355" y="610" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#0F1729" text-anchor="end">บาท THB (฿)</text>
  </g>

  <!-- Legal & Account Deletion -->
  <g id="LegalSection">
    <rect x="20" y="648" width="353" height="100" rx="16" fill="#FFFFFF" stroke="#EDF0F5"/>
    <text x="38" y="674" font-family="'Prompt', sans-serif" font-size="12" fill="#4B5563">นโยบายความเป็นส่วนตัว (Privacy Policy)</text>
    <text x="355" y="674" font-family="'Prompt', sans-serif" font-size="12" fill="#9AA3B2" text-anchor="end">›</text>
    <line x1="38" y1="688" x2="355" y2="688" stroke="#F1F5F9" stroke-width="1"/>

    <text x="38" y="708" font-family="'Prompt', sans-serif" font-size="12" fill="#4B5563">ติดต่อฝ่ายสนับสนุน (Support)</text>
    <text x="355" y="708" font-family="'Prompt', sans-serif" font-size="12" fill="#9AA3B2" text-anchor="end">›</text>
    <line x1="38" y1="722" x2="355" y2="722" stroke="#F1F5F9" stroke-width="1"/>

    <text x="38" y="738" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#E5484D">ลบบัญชีและข้อมูลทั้งหมด (Apple Guideline 5.1.1)</text>
  </g>

  <!-- Bottom Navigation Bar (Tab 5 active) -->
  <g id="BottomNavBar">
    <rect x="0" y="768" width="393" height="84" fill="#FFFFFF" stroke="#EDF0F5"/>
    
    <!-- Tab 1: Home -->
    <path d="M48 788l-9 8v12h6v-8h6v8h6v-12z" fill="#9AA3B2"/>
    <text x="48" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="500" fill="#9AA3B2" text-anchor="middle">หน้าแรก</text>

    <!-- Tab 2: Groups -->
    <circle cx="120" cy="794" r="5" stroke="#9AA3B2" stroke-width="2" fill="none"/>
    <path d="M112 808c0-4 4-6 8-6s8 2 8 6" stroke="#9AA3B2" stroke-width="2" fill="none"/>
    <text x="120" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="500" fill="#9AA3B2" text-anchor="middle">กลุ่ม</text>

    <!-- Tab 3: Center Plus Action -->
    <circle cx="196" cy="795" r="24" fill="url(#primary-grad-s11)"/>
    <path d="M196 786v18M187 795h18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Tab 4: Statistics -->
    <path d="M266 808v-8M273 808v-14M280 808v-10" stroke="#9AA3B2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="273" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="500" fill="#9AA3B2" text-anchor="middle">สถิติ</text>

    <!-- Tab 5: Profile (Active) -->
    <circle cx="345" cy="794" r="5" stroke="#2D6BFF" stroke-width="2" fill="none"/>
    <path d="M337 808c0-4 4-6 8-6s8 2 8 6" stroke="#2D6BFF" stroke-width="2" fill="none"/>
    <text x="345" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="600" fill="#2D6BFF" text-anchor="middle">โปรไฟล์</text>

    <rect x="129" y="838" width="135" height="5" rx="2.5" fill="#0F1729"/>
  </g>
</svg>
