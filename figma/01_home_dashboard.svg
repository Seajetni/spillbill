<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-card" x="-4" y="0" width="401" height="860" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F1729" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-btn" x="0" y="0" width="200" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2D6BFF" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1729"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6BFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Screen Background -->
  <rect width="393" height="852" rx="44" fill="#F5F7FA"/>

  <!-- Status Bar & Dynamic Island -->
  <rect x="131" y="11" width="131" height="35" rx="17.5" fill="#000000"/>
  <text x="36" y="34" font-family="'Prompt', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F1729">9:41</text>
  <!-- Wi-Fi & Battery -->
  <path d="M340 24h18v10h-18z" rx="3" stroke="#0F1729" stroke-width="2" fill="none"/>
  <rect x="342" y="26" width="12" height="6" rx="1.5" fill="#0F1729"/>
  <path d="M359 27v4" stroke="#0F1729" stroke-width="2" stroke-linecap="round"/>

  <!-- Header -->
  <g id="Header">
    <text x="24" y="80" font-family="'Prompt', sans-serif" font-size="13" font-weight="500" fill="#9AA3B2">สวัสดีตอนบ่าย</text>
    <text x="24" y="106" font-family="'Kanit', sans-serif" font-size="22" font-weight="700" fill="#0F1729">ป๊อป 👨‍💻</text>
    
    <!-- Notification Bell -->
    <rect x="325" y="74" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#EDF0F5"/>
    <path d="M347 88c-3.3 0-6 2.7-6 6v4l-2 2v1h16v-1l-2-2v-4c0-3.3-2.7-6-6-6z" fill="#0F1729"/>
    <circle cx="355" cy="85" r="5" fill="#E5484D"/>
    <text x="353" y="88" font-family="'Prompt', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">3</text>
  </g>

  <!-- Hero Net Balance Card -->
  <g id="HeroCard" filter="url(#shadow-card)">
    <rect x="20" y="130" width="353" height="156" rx="24" fill="url(#hero-grad)"/>
    <text x="40" y="162" font-family="'Prompt', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">ยอดสุทธิรวม (Net Balance)</text>
    <text x="40" y="202" font-family="'Kanit', sans-serif" font-size="34" font-weight="800" fill="#0FBF7F">+฿1,840.00</text>
    
    <!-- Sub-metrics -->
    <line x1="40" y1="220" x2="353" y2="220" stroke="#334155" stroke-width="1"/>
    
    <text x="40" y="246" font-family="'Prompt', sans-serif" font-size="12" fill="#94A3B8">เขาติดเรา</text>
    <text x="40" y="266" font-family="'Prompt', sans-serif" font-size="15" font-weight="700" fill="#34D399">+฿2,350.00</text>
    
    <text x="210" y="246" font-family="'Prompt', sans-serif" font-size="12" fill="#94A3B8">เราติดเขา</text>
    <text x="210" y="266" font-family="'Prompt', sans-serif" font-size="15" font-weight="700" fill="#FB923C">-฿510.00</text>
  </g>

  <!-- Quick Action Buttons -->
  <g id="QuickActions">
    <rect x="20" y="302" width="108" height="76" rx="18" fill="#FFFFFF" stroke="#EDF0F5"/>
    <text x="64" y="332" font-size="22" text-anchor="middle">📷</text>
    <text x="74" y="358" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#0F1729" text-anchor="middle">สแกนบิล OCR</text>

    <rect x="142" y="302" width="108" height="76" rx="18" fill="#FFFFFF" stroke="#EDF0F5"/>
    <text x="186" y="332" font-size="22" text-anchor="middle">✍️</text>
    <text x="196" y="358" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#0F1729" text-anchor="middle">กรอกบิลเอง</text>

    <rect x="265" y="302" width="108" height="76" rx="18" fill="#FFFFFF" stroke="#EDF0F5"/>
    <text x="309" y="332" font-size="22" text-anchor="middle">🔁</text>
    <text x="319" y="358" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#0F1729" text-anchor="middle">ทำซ้ำบิลเดิม</text>
  </g>

  <!-- Section Title: ต้องจัดการ -->
  <text x="24" y="412" font-family="'Kanit', sans-serif" font-size="18" font-weight="700" fill="#0F1729">ต้องจัดการ</text>
  <rect x="317" y="396" width="56" height="24" rx="12" fill="#EAF0FF"/>
  <text x="345" y="412" font-family="'Prompt', sans-serif" font-size="11" font-weight="600" fill="#2D6BFF" text-anchor="middle">3 รายการ</text>

  <!-- Debt Card 1: มิ้นท์ ติดเรา -->
  <g id="DebtCard1" filter="url(#shadow-card)">
    <rect x="20" y="430" width="353" height="82" rx="18" fill="#FFFFFF" stroke="#EDF0F5"/>
    <circle cx="52" cy="471" r="20" fill="#E4F8F1"/>
    <text x="52" y="478" font-size="20" text-anchor="middle">👩‍🎨</text>
    <text x="82" y="462" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#0F1729">มิ้นท์ (หมูกระทะริมน้ำ 🍲)</text>
    <text x="82" y="482" font-family="'Prompt', sans-serif" font-size="12" fill="#0FBF7F">ติดเรา • ฿450.00</text>
    
    <!-- Action Button: Voice Nudge -->
    <rect x="279" y="451" width="82" height="38" rx="12" fill="#EAF0FF"/>
    <text x="320" y="475" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#2D6BFF" text-anchor="middle">🔊 ทวงเงิน</text>
  </g>

  <!-- Debt Card 2: โอ๊ค ติดเรา -->
  <g id="DebtCard2" filter="url(#shadow-card)">
    <rect x="20" y="522" width="353" height="82" rx="18" fill="#FFFFFF" stroke="#EDF0F5"/>
    <circle cx="52" cy="563" r="20" fill="#E4F8F1"/>
    <text x="52" y="570" font-size="20" text-anchor="middle">🧑‍💼</text>
    <text x="82" y="554" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#0F1729">โอ๊ค (ค่าเน็ตคอนโด 🏠)</text>
    <text x="82" y="574" font-family="'Prompt', sans-serif" font-size="12" fill="#0FBF7F">ติดเรา • ฿280.00</text>
    
    <rect x="279" y="543" width="82" height="38" rx="12" fill="#EAF0FF"/>
    <text x="320" y="567" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#2D6BFF" text-anchor="middle">🔊 ทวงเงิน</text>
  </g>

  <!-- Debt Card 3: เราติดเฟิร์น -->
  <g id="DebtCard3" filter="url(#shadow-card)">
    <rect x="20" y="614" width="353" height="82" rx="18" fill="#FFFFFF" stroke="#EDF0F5"/>
    <circle cx="52" cy="655" r="20" fill="#FFF1E7"/>
    <text x="52" y="662" font-size="20" text-anchor="middle">👩‍🔬</text>
    <text x="82" y="646" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#0F1729">เฟิร์น (ค่าน้ำมันเขาใหญ่ 🚗)</text>
    <text x="82" y="666" font-family="'Prompt', sans-serif" font-size="12" fill="#FF8A3D">เราติดเขา • ฿510.00</text>
    
    <rect x="279" y="635" width="82" height="38" rx="12" fill="#FFF1E7"/>
    <text x="320" y="659" font-family="'Prompt', sans-serif" font-size="12" font-weight="600" fill="#FF8A3D" text-anchor="middle">💳 จ่ายเงิน</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g id="BottomNavBar">
    <rect x="0" y="768" width="393" height="84" fill="#FFFFFF" stroke="#EDF0F5"/>
    
    <!-- Tab 1: Home (Active) -->
    <path d="M48 788l-9 8v12h6v-8h6v8h6v-12z" fill="#2D6BFF"/>
    <text x="48" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="600" fill="#2D6BFF" text-anchor="middle">หน้าแรก</text>

    <!-- Tab 2: Groups -->
    <circle cx="120" cy="794" r="5" stroke="#9AA3B2" stroke-width="2" fill="none"/>
    <path d="M112 808c0-4 4-6 8-6s8 2 8 6" stroke="#9AA3B2" stroke-width="2" fill="none"/>
    <text x="120" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="500" fill="#9AA3B2" text-anchor="middle">กลุ่ม</text>

    <!-- Tab 3: Center Plus Action -->
    <circle cx="196" cy="795" r="24" fill="url(#primary-grad)"/>
    <path d="M196 786v18M187 795h18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Tab 4: Statistics -->
    <path d="M266 808v-8M273 808v-14M280 808v-10" stroke="#9AA3B2" stroke-width="2.5" stroke-linecap="round"/>
    <text x="273" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="500" fill="#9AA3B2" text-anchor="middle">สถิติ</text>

    <!-- Tab 5: Profile -->
    <circle cx="345" cy="794" r="5" stroke="#9AA3B2" stroke-width="2" fill="none"/>
    <path d="M337 808c0-4 4-6 8-6s8 2 8 6" stroke="#9AA3B2" stroke-width="2" fill="none"/>
    <text x="345" y="820" font-family="'Prompt', sans-serif" font-size="10" font-weight="500" fill="#9AA3B2" text-anchor="middle">โปรไฟล์</text>

    <!-- Home Indicator -->
    <rect x="129" y="838" width="135" height="5" rx="2.5" fill="#0F1729"/>
  </g>
</svg>
